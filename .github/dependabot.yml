version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions-all:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
